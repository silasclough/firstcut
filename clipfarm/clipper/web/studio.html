<!doctype html>
<!--
  FirstCut (the app, app/VideoBuilder; first called Video Builder) - design notes (CLAUDE.md UI rules). Approved design: https://claude.ai/artifact/8RzjiEL4HzWMdtdbtwtpas ("Chosen direction").
  1. North star: "Say what you're making, drop the footage, press one button" - a long video with B-roll and a Final Cut project, or short
     clips; everything you have made, and what is being made now, is always one click away in the sidebar.
     Home (2026-11-05): "Pick up where you left off" - recent projects as big thumbnails, click to select, double-click or Enter to open
     (like Logic Pro's project chooser); Long form and Short form are the two composers, one kind each (no switch between them).
  2. User and context: an editor at a desk (Final Cut), and a creator friend on a 16 GB M3 who uses ChatGPT skills; neither cares about AI
     settings; the window may be half the screen.
  3. Principles: guide (one primary button per screen), speed (drop anywhere, Enter submits, big targets), explore (options as small menus
     starting from the defaults; everything else in Settings), reassure (progress you can see, plain words, nothing posted anywhere).
  4. Build: sidebar (see-through: the Mac's own sidebar material shows through in the app) + Home composer, long-form project, short clips,
     Find footage, Settings (General, AI, How it edits, Where things go, Footage library), first-run Setup. Follows the Mac's light/dark
     (or the setting); one light-blue accent; system font; works down to 860 px wide.
-->

    --viol: #6d4fc2; --good: #2f7a4b; --warn: #8a5a00; --bad: #b3322b; --scrim: rgba(22,32,44,.30); --radius: 12px;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; color-scheme: light;
  }

    --win: #0a0b0d; --side: rgba(8,9,11,.9); --panel: #15171a; --field: #1e2125; --chip: #2a2e34; --line: #2a2e34; --thumb: #23272d;
    --text: #f3f4f6; --muted: #9ba4b0; --accent: #7dbdf0; --link: #8fc8f3; --sel: rgba(255,255,255,.08); --seg: #3a3f47;
    --viol: #b3a4f2; --good: #8fc79a; --warn: #e0b45c; --bad: #ef8c84; --scrim: rgba(0,0,0,.5); color-scheme: dark;

     sits on it, see-through, and the window's blurred backdrop shows in the 8 px around it */
  :root.glass { --side: transparent; }
  :root.glass #side { border-right: 0; padding: 52px 18px 18px; }
  :root.glass main { margin: 0; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  .shots-wrap:empty { display: none; }
  .rp-search { display: flex; align-items: center; gap: 8px; margin: 0 20px 10px; padding: 0 6px 0 12px; height: 40px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); }

  .shot-pic img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .stale { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 14px; border: 1px solid var(--accent); border-radius: 6px; background: color-mix(in srgb, var(--accent) 9%, transparent); }
  .stale b { font-weight: 600; }
  /* the shot trim editor (shotEdit*): a strip of stills with two handles; the lit part is what the shot shows */
  .se-video { position: relative; background: #000; border-radius: 8px; overflow: hidden; aspect-ratio: 16 / 9; margin: 0 20px; max-height: 300px; display: flex; align-items: center; justify-content: center; }
  .se-video video, .se-video img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .se-strip { position: relative; display: flex; height: 62px; margin: 14px 28px 4px; user-select: none; -webkit-user-select: none; touch-action: none; }
  .se-strip img.se-still { flex: 1 1 0; min-width: 0; height: 100%; object-fit: cover; pointer-events: none; background: var(--sel); }
  .se-dim { position: absolute; top: 0; bottom: 0; background: rgba(0,0,0,.55); pointer-events: none; }
  .se-win { position: absolute; top: -2px; bottom: -2px; border: 2px solid var(--accent); border-radius: 3px; cursor: grab; box-sizing: border-box; }
  .se-win:active { cursor: grabbing; }
  .se-h { position: absolute; top: -6px; bottom: -6px; width: 14px; margin-left: -7px; background: var(--accent); border-radius: 4px; cursor: ew-resize; display: flex; align-items: center; justify-content: center; outline-offset: 2px; }
  .se-h::after { content: ""; width: 2px; height: 20px; background: #fff; border-radius: 1px; }
  .se-head { position: absolute; top: -4px; bottom: -4px; width: 2px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.5); pointer-events: none; }
  .se-read { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 8px 28px 0; font-variant-numeric: tabular-nums; }
  .se-nudge { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 28px 4px; align-items: center; }
  .se-nudge .grp { display: inline-flex; align-items: center; gap: 4px; }
  .se-nudge .btn { height: 28px; padding: 0 8px; font-size: 12px; }
  .rp-list { flex: 1; overflow-y: auto; padding: 0 20px 12px; display: flex; flex-direction: column; gap: 8px; }
  .rp-row { display: flex; align-items: center; gap: 12px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; cursor: pointer; font: inherit; }
  .rp-row:hover { background: var(--sel); }
  .rp-pic { flex: 0 0 auto; width: 128px; aspect-ratio: 16 / 9; border-radius: 4px; overflow: hidden; background: var(--sel); }
  .rp-pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .rp-what { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 13px; line-height: 1.35; margin-bottom: 2px; }
  .rp-row .rp-use { flex: 0 0 auto; height: 30px; pointer-events: none; }
  .rp-row:hover .rp-use, .rp-row:focus-visible .rp-use { background: var(--accent); border-color: var(--accent); color: var(--on-accent, #fff); }
/* the plan before the video is made, what was checked after, the small numbers under a short clip */
.pr{display:flex;flex-direction:column;gap:20px;max-width:760px}
.pr-lead{font-size:16px;font-weight:600;line-height:1.4;margin:0}
.pr-sec{display:flex;flex-direction:column;gap:6px}
.pr-sec>h3{margin:0;font-size:12px;font-weight:600;color:var(--muted)}
.pr-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.pr-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:2px 12px;align-items:start;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13px;line-height:1.4}
.pr-row .t{color:var(--muted);font-variant-numeric:tabular-nums}
.pr-row .w{overflow-wrap:anywhere}
.pr-row.left .w{text-decoration:line-through;color:var(--muted)}
.pr-sub{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.pr-state{font-size:12px;font-weight:600;white-space:nowrap;color:var(--muted)}
.pr-state.err{color:inherit}
.pr-q{border:1px solid var(--accent);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.pr-choice{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:13px;line-height:1.4;cursor:pointer}
.pr-choice input{margin-top:3px}
.pr details{border-top:1px solid var(--line);padding-top:8px}
.pr summary{cursor:pointer;font-size:13px;color:var(--muted)}
.pr-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding-top:10px}
.pr-opts label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.pr-opts select{font:inherit;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:5px;padding:6px 8px}
.pr-bar{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 0;background:var(--win);border-top:1px solid var(--line)}
.pr-link{background:none;border:0;padding:0;font:inherit;font-size:12px;color:var(--link);cursor:pointer;text-align:left}
.pr-link:hover{text-decoration:underline}
.pr-ok{color:var(--muted)}
.clipn{font-size:11.5px;line-height:1.35;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.clipn button{background:none;border:0;padding:0;font:inherit;color:var(--link);cursor:pointer}
@media (max-width:560px){.pr-row{grid-template-columns:44px minmax(0,1fr)}.pr-row .act{grid-column:2}}
.tx-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.tx-row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.tx-row:hover{background:var(--hover,rgba(127,127,127,.08))}
.tx-row .tiny-bar{grid-column:1/-1}
.tx-text p{display:grid;grid-template-columns:52px 1fr;gap:0 12px;margin:0 0 14px;line-height:1.6;font-size:15px;user-select:text;-webkit-user-select:text}
.tx-t{padding-top:3px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;user-select:none;-webkit-user-select:none}
  a, img, svg, button { -webkit-user-drag: none; user-drag: none; }          /* an app, not a page: links and pictures don't drag out */
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }   /* ...and its words don't select like a page's */
  input, textarea, .err, .path, .selectable { -webkit-user-select: text; user-select: text; }
  .ctx { position: fixed; z-index: 30; min-width: 210px; padding: 5px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); box-shadow: 0 8px 28px rgba(0,0,0,.28); display: flex; flex-direction: column; }
  .ctx button { text-align: left; padding: 6px 10px; border: 0; border-radius: 6px; background: transparent; }
  .ctx button:hover, .ctx button:focus-visible { background: var(--accent); color: var(--on-accent); outline: none; }
  .ctx button.danger { color: var(--bad); }
  .ctx button.danger:hover { color: var(--on-accent); }
  .toast { position: fixed; z-index: 40; left: 50%; bottom: 22px; transform: translateX(-50%); max-width: min(560px, calc(100% - 40px)); padding: 12px 16px; box-shadow: 0 8px 28px rgba(0,0,0,.28); }
  .styles { flex: 1; overflow-y: auto; padding: 4px 20px 16px; display: flex; flex-direction: column; gap: 10px; }
  .style-row { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; cursor: default; }
  .style-row:hover { background: var(--sel); }
  .style-row.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .style-shots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .style-shots img { width: 100%; aspect-ratio: 16 / 9; border-radius: 6px; background: var(--thumb); display: block; }
  .style-shots.tall { grid-template-columns: repeat(3, minmax(0, 150px)); }
  .style-shots.tall img { aspect-ratio: 9 / 16; }
  .menu { max-height: min(420px, 70vh); overflow-y: auto; min-width: 180px; }

  .song-curve svg { width: 100%; height: 100%; display: block; } .song-curve path { fill: var(--accent); opacity: .5; }
  .song-curve i { position: absolute; top: 2px; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 1.5px var(--panel); }
  @media (max-width: 1000px) { .song-curve { display: none; } }
  .songs { flex: 1; overflow-y: auto; padding: 4px 20px 12px; display: flex; flex-direction: column; gap: 6px; }
  .song { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 12px; }
  /* the scrub bar: the song's waveform; played part in the accent, a playhead; click or drag to jump */
  .wave { position: relative; flex: 1 1 160px; min-width: 120px; max-width: 360px; height: 30px; cursor: pointer; touch-action: none; border-radius: 4px; }
  .wave .wbars, .wave .wbars > * { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .wave .wbars svg { width: 100%; height: 100%; }
  .wave.real .wbars svg rect { fill: var(--muted); opacity: .55; }

  .wave.on.real .wbars svg rect { fill: var(--accent); opacity: 1; }
  .wave .whead { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--text, currentColor); border-radius: 1px; left: 0; display: none; }
  .wave.on .whead { display: block; }
  .wave:not(.real) { border-bottom: 1px solid var(--line); }
  .wave:hover { background: rgba(127,127,127,.06); }
  .wave .song-curve { display: block !important; width: 100%; height: 100%; }
  .stock-key { grid-column: 1 / -1; padding: 10px 14px; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 6px; font-size: 13px; color: var(--muted); }
  .stock-key b { color: var(--text); font-weight: 600; }
  .stock-key a { margin-left: 6px; white-space: nowrap; }
  .cn-step { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; }
  .snip { position: relative; display: flex; gap: 8px; align-items: flex-start; }
  .snip pre { flex: 1; min-width: 0; margin: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg, transparent);
              font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-all; user-select: text; -webkit-user-select: text; }
  .use-pop { position: fixed; z-index: 60; width: 240px; padding: 14px; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--line);
             border-radius: 12px; background: var(--panel); box-shadow: 0 8px 28px rgba(0,0,0,.28); pointer-events: none; }
  html.glass .use-pop { background: color-mix(in srgb, var(--panel) 86%, transparent); backdrop-filter: blur(20px) saturate(1.3); -webkit-backdrop-filter: blur(20px) saturate(1.3); }
  .up-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }

  .up-speed { display: flex; align-items: baseline; gap: 8px; }
  .up-big { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .up-spark { width: 100%; height: 28px; }
  .mbar { position: sticky; bottom: 0; z-index: 5; display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 10px 12px;
          border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
  .mbar .wave { max-width: none; }
  html.glass .mbar { background: color-mix(in srgb, var(--panel) 82%, transparent); backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3); }
  .song:hover { background: var(--sel); }

  .song-energy { flex: none; } .song-energy path { fill: var(--accent); opacity: .55; }
  .ctx hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }
  html, body { margin: 0; height: 100%; }

  button, input, select, textarea { font: inherit; color: inherit; }

  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .grow { flex: 1; }
  .btn { height: 32px; padding: 0 14px; border: 0; border-radius: 9px; background: var(--field); color: var(--text); white-space: nowrap; }
  .btn:hover { filter: brightness(.97); }
  .btn.primary { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn.quiet { background: transparent; border: 1px solid var(--line); }
  .btn.danger { color: var(--bad); }
  .btn:disabled { opacity: .5; cursor: default; }
  .seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--field); }
  .seg button { height: 28px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; font-weight: 600; }
  .seg button.on { background: var(--seg); box-shadow: 0 0 0 1px var(--line); }
  .chip { position: relative; flex: none; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 26px 0 10px; border: 1px solid var(--line); border-radius: 10px; }
  .chip .k { color: var(--muted); }
  .chip select { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .chip::after { content: ""; position: absolute; right: 10px; top: 12px; width: 6px; height: 6px; border-right: 1.4px solid currentColor; border-bottom: 1.4px solid currentColor; transform: rotate(45deg); opacity: .7; }
  .card { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
  .bar { height: 5px; border-radius: 3px; background: var(--chip); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); transition: width .6s ease; }
  .err { color: var(--bad); white-space: pre-wrap; }
  .field { width: 100%; height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--field); color: var(--text); }

  /* home: recent projects */
  .recent { padding: 2px 24px 28px; display: flex; flex-direction: column; gap: 16px; min-height: 100%; }
  .suggest { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .sug { display: flex; gap: 12px; align-items: flex-start; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text); }
  .sug:hover { background: var(--sel); border-color: var(--accent); }
  .sug svg { flex: none; margin-top: 1px; color: var(--accent); }
  .sug b { display: block; font-size: 13.5px; } .sug .small { display: block; margin-top: 2px; }
  .picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .pick-t { position: relative; padding: 0; border: 0; border-radius: 9px; overflow: hidden; aspect-ratio: 16 / 9; background: var(--thumb); }
  .pick-t img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pick-t:hover { box-shadow: 0 0 0 2px var(--accent); }
  .new-bar { padding: 10px 10px 10px 16px; border-color: var(--accent); flex-wrap: nowrap; }
  .compose-recent { width: 100%; max-width: 1000px; margin-top: 34px; display: flex; flex-direction: column; gap: 12px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
  .tile { display: flex; flex-direction: column; gap: 6px; padding: 7px; border-radius: 14px; user-select: none; -webkit-user-select: none; cursor: default; outline: none; }
  .tile:hover { background: var(--sel); }
  .tile.sel { background: var(--sel); box-shadow: 0 0 0 2px var(--accent); }
  .tile .t { position: relative; aspect-ratio: 16 / 9; border-radius: 9px; background: var(--thumb); overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 3px; color: var(--muted); }
  .tile .t img { height: 100%; display: block; object-fit: cover; }
  .tile .t img.wide { width: 100%; }
  .tile .t img.tall { aspect-ratio: 9 / 16; }
  .tile .t .tiny-bar { position: absolute; left: 8px; right: 8px; bottom: 8px; width: auto; height: 4px; background: rgba(0,0,0,.45); }
  .tile b { font-size: 13px; }
  .actbar { position: sticky; bottom: 0; margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 16px; }
  .home-find { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; max-width: 520px; }
  .home-find input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 14px; }

  /* composer */
  .modes.two { grid-template-columns: repeat(2, 1fr); }
  .modes { width: 100%; max-width: 760px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  @media (max-width: 720px) { .modes, .modes.two { grid-template-columns: 1fr; } }
  .mode { display: flex; gap: 12px; align-items: flex-start; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text); }
  .mode svg { flex: none; margin-top: 2px; color: var(--muted); }
  .mode:hover { background: var(--sel); }
  .mode.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .mode.on svg { color: var(--accent); }
  .mode b { display: block; font-size: 14px; }
  .mode .small { display: block; margin-top: 2px; }
  .home { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 40px 70px; }
  .composer { width: 100%; max-width: 760px; padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 10px; border-radius: 20px; }
  .composer.drag { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .source { display: inline-flex; align-items: center; gap: 10px; padding: 8px 10px 8px 8px; border-radius: 12px; background: var(--field); max-width: 100%; }
  .source .ic { width: 36px; height: 36px; flex: none; border-radius: 8px; background: var(--thumb); display: flex; align-items: center; justify-content: center; }
  .x { width: 22px; height: 22px; border: 0; border-radius: 50%; background: var(--chip); color: var(--muted); line-height: 1; padding: 0; }
  /* What was dropped: little thumbnails you can click to see it play, and take out. Hint while files are dragged over the window. */
  .tray { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 6px; }
  .dtile { position: relative; flex: none; width: 124px; display: flex; flex-direction: column; gap: 4px; }
  .dtile-open { all: unset; box-sizing: border-box; position: relative; display: flex; align-items: center; justify-content: center; width: 100%; aspect-ratio: 16 / 10; border-radius: 8px;
                overflow: hidden; background: #000; cursor: pointer; border: 1px solid var(--line); }
  .dtile-open:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .dtile-open[disabled] { cursor: default; }
  .dtile-open img { width: 100%; height: 100%; object-fit: contain; }
  .dtile-link { padding: 6px; font-size: 12px; text-align: center; color: var(--muted); background: var(--field); width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .dtile-dur { position: absolute; right: 4px; bottom: 4px; padding: 1px 5px; border-radius: 4px; font-size: 11px; font-variant-numeric: tabular-nums; color: #fff; background: rgba(0,0,0,.62); }
  .dtile-x { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,.62); color: #fff; }
  .dtile-name { max-width: 100%; }
  .dtile-wait .dtile-open { cursor: default; }
  body.dropping #composer { outline: 2px dashed var(--accent); outline-offset: 4px; }
  .drop-hint { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 80; padding: 8px 16px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 13px; font-weight: 600; pointer-events: none; }
  .drop-hint[hidden] { display: none !important; }
  .dprev { position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center; background: var(--scrim); }
  .dprev-box { width: min(880px, 92vw); max-height: 88vh; display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
  .dprev-box video, .dprev-still { width: 100%; max-height: 66vh; object-fit: contain; background: #000; border-radius: 8px; }
  .dprev-bar { display: flex; align-items: center; gap: 10px; }
  .composer textarea { border: 0; outline: 0; resize: none; background: transparent; font-size: 15px; line-height: 1.5; padding: 2px 4px; min-height: 66px; }
  .notes-wrap { position: relative; display: flex; }
  .notes-wrap textarea { flex: 1; padding-right: 44px; }
  .mic { position: absolute; right: 2px; bottom: 2px; height: 32px; min-width: 32px; padding: 0 8px; border: 0; border-radius: 16px; background: transparent;
         color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; }
  .mic:hover { background: var(--sel); color: var(--text); }
  .mic.rec { background: var(--bad); color: #fff; }
  .mic.rec svg { animation: none; }
  .mic.busy { color: var(--accent); }
  .mic-t { font-size: 12px; font-variant-numeric: tabular-nums; }
  .mic-hint { position: fixed; z-index: 70; max-width: min(560px, calc(100vw - 16px)); padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px;
              background: var(--panel); color: var(--muted); font-size: 13px; pointer-events: none; overflow-wrap: anywhere; }
  .mic-hint[hidden] { display: none; }
  .mic.mic-in { position: static; flex: none; }
  .notes-row { gap: 10px; flex-wrap: nowrap; align-items: center; min-width: 0; }
  .mic:disabled { opacity: .4; pointer-events: none; }
  .link { border: 0; background: transparent; padding: 0; color: var(--accent); font: inherit; cursor: pointer; }
  .link:hover { text-decoration: underline; }
  .link-in { flex: 1; min-width: 200px; height: 36px; padding: 0 12px; border: 1px dashed var(--line); border-radius: 10px; background: transparent; }

  /* project pages */
  .page { padding: 4px 24px 24px; display: flex; flex-direction: column; gap: 14px; }
  .lf-video { display: block; width: 100%; max-width: min(100%, max(360px, calc((100vh - 210px) * 16 / 9))); aspect-ratio: 16 / 9; height: auto;
              margin: 0 auto; background: #000; border-radius: 12px; object-fit: contain; }    /* fits the column and the window, centred */
  .clips { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
  .clip { display: flex; flex-direction: column; gap: 7px; }
  .clips.archived .clip .v { opacity: .5; cursor: default; filter: grayscale(.6); }
  .arch { display: flex; gap: 14px; align-items: center; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  .arch-pic { flex: none; width: 160px; aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; background: var(--thumb); }
  .arch-pic img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .5; filter: grayscale(.6); }
  .arch-t { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .st-list { display: flex; flex-direction: column; }
  .st-row { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-bottom: 1px solid var(--line); min-width: 0; }
  .st-row:last-child { border-bottom: 0; }
  .st-row.gone { opacity: .65; }
  .st-kind { width: 38px; flex: none; }
  .st-n { width: 62px; flex: none; text-align: right; font-variant-numeric: tabular-nums; }
  .st-age { width: 88px; flex: none; }
  .st-row .btn[aria-pressed="true"] { color: var(--accent); }
  .clip .v { position: relative; aspect-ratio: 9 / 16; border-radius: 12px; overflow: hidden; background: var(--thumb); cursor: pointer; }
  .clip .v img, .clip .v video { width: 100%; height: 100%; object-fit: cover; display: block; }
  video:fullscreen { object-fit: contain !important; background: #000; }
  video:-webkit-full-screen { object-fit: contain !important; background: #000; }
  .clip.off { opacity: .45; }
  .clip.sel .v { outline: 2px solid var(--accent); outline-offset: 2px; }
  .badge { position: absolute; right: 8px; bottom: 8px; font-size: 11px; padding: 1px 6px; border-radius: 6px; background: rgba(0,0,0,.65); color: #fff; }
  .keep { position: absolute; top: 8px; left: 8px; width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
  .ask { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 8px 0 14px; }
  .ask input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 14px; }

  /* find */
  .find { display: flex; flex-direction: column; height: 100%; }
  .find-main { flex: 1; }
  /* the shot player: a shot grows out of its thumbnail to about half the window, and shrinks back into it */
  .shot .t .play { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%;
                   background: rgba(0,0,0,.42); border: 1px solid rgba(255,255,255,.4); display: flex; align-items: center; justify-content: center;
                   color: #fff; opacity: 0; transition: opacity .12s; pointer-events: none; }
  .shot:hover .t .play, .shot:focus-visible .t .play { opacity: 1; }
  .shot:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 10px; }
  .pscrim { position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.42); opacity: 0; transition: opacity .18s; }
  .pscrim.on { opacity: 1; }
  .player { position: fixed; z-index: 26; border-radius: 12px; overflow: hidden; background: #000; box-shadow: 0 18px 50px rgba(0,0,0,.5); transform-origin: 0 0; }
  .player.anim { transition: transform .18s cubic-bezier(.2,.8,.2,1); }
  .player video, .player img.full { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; cursor: pointer; }
  .player .pbar { position: absolute; left: 10px; bottom: 10px; right: 10px; display: flex; align-items: center; gap: 10px; pointer-events: none; }
  .player .pp { pointer-events: auto; width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(0,0,0,.55); color: #fff;
                display: flex; align-items: center; justify-content: center; flex: none; }
  .player .pp:hover { background: rgba(0,0,0,.75); }
  .player .cap { color: #fff; font-size: 12px; background: rgba(0,0,0,.55); padding: 4px 9px; border-radius: 8px; max-width: 70%; }
  .player .ppick { position: absolute; top: 10px; left: 10px; display: flex; align-items: center; gap: 7px; padding: 5px 9px 5px 7px; border-radius: 8px;
                   background: rgba(0,0,0,.55); color: #fff; font-size: 12px; cursor: pointer; }
  .player .ppick input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
  /* Edit from the transcript (te*): a collapsed row; open, a scrolling box of the words. In the video = green marker AND underline (never colour alone). */
  .te { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .te-toggle { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--text); text-align: left; font: inherit; cursor: pointer; }
  .te-toggle:hover { background: var(--sel); }
  .te-toggle b { font-weight: 600; }
  .te-toggle .grow { flex: 1; min-width: 0; }
  .te-badge { font-size: 12px; font-weight: 600; color: var(--accent); }
  .te-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .te-box { max-height: 340px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; font-size: 14px; line-height: 1.85; user-select: text; -webkit-user-select: text; cursor: text; outline: none; }
  .te-box:focus-visible { border-color: var(--accent); }
  .te-box p { margin: 0 0 12px; }
  .te-box p:last-child { margin-bottom: 0; }
  .te-w { padding: 1px 0; border-bottom: 2px solid transparent; border-radius: 2px; }
  .te-w.f0 { color: var(--text); background: color-mix(in srgb, var(--viol) 14%, transparent); border-bottom: 2px dotted var(--viol); }
  .te-legend button.te-w { font: inherit; cursor: pointer; color: var(--text); padding: 2px 8px; border-radius: 4px; border-top: 0; border-left: 0; border-right: 0; }
  .te-legend button.te-w[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
  .te-box.focus-in .te-w.f0, .te-box.focus-out .te-w.f1 { opacity: .28; }
  .te-w.f1 { color: var(--text); background: color-mix(in srgb, var(--good) 15%, transparent); border-bottom-color: var(--good); }
  .te-w.f2 { color: var(--muted); text-decoration: line-through; background: color-mix(in srgb, var(--bad) 15%, transparent); border-bottom-color: var(--bad); }
  .te-w.f3 { color: var(--text); background: color-mix(in srgb, var(--accent) 18%, transparent); border-bottom: 2px dashed var(--accent); }
  .te-box ::selection { background: color-mix(in srgb, var(--accent) 38%, transparent); }
  .te-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .te-tools .grow { flex: 1; min-width: 12px; }
  .te-seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .te-seg button { font: inherit; font-size: 13px; padding: 4px 11px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
  .te-seg button + button { border-left: 1px solid var(--line); }
  .te-seg button[aria-pressed="true"] { color: var(--accent); font-weight: 600; background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .te-seg button:focus-visible, .te-find:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .te-find { font: inherit; font-size: 13px; width: 170px; max-width: 100%; padding: 4px 9px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--text); }
  .te-box p.te-line { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 0 10px; margin: 0 0 8px; }
  .te-at { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 2px; user-select: none; -webkit-user-select: none; }
  .te-src { display: block; color: var(--muted); font-size: 11.5px; line-height: 1.4; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: none; -webkit-user-select: none; }
  .te-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .te-bar .grow { flex: 1; min-width: 120px; }
  .te-staged { padding: 10px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
  .mf-row { gap: 10px; flex-wrap: wrap; align-items: center; min-height: 34px; }
  .mf-msg a { margin-left: 4px; }
  .mf-body { display: flex; flex-direction: column; min-height: 0; flex: 1; }
  .mf-pad { padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 10px; }
  .mf-list { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 20px 8px; }
  .mf-g { padding: 12px 0 4px; }
  .mf-song { display: flex; align-items: center; gap: 10px; padding: 7px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .mf-song input { flex: none; accent-color: var(--accent); }
  .mf-noplay { width: 28px; display: flex; justify-content: center; opacity: .3; flex: none; }
  .mf-maybe { margin-top: 14px; } .mf-maybe summary { cursor: pointer; padding: 6px 0; }
  .mf-left { padding: 10px 0 0; }
  .mf-foot { border-top: 1px solid var(--line); padding: 12px 20px 16px; display: flex; flex-direction: column; gap: 8px; }
  .mf-chips { display: flex; flex-wrap: wrap; gap: 6px; } .mf-chip { border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; font-size: 13px; }
  .nav a .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-left: 6px; vertical-align: middle; }
  .prog-line { margin-top: 4px; font-variant-numeric: tabular-nums; }
  .prog-slow { margin-top: 4px; color: var(--warn); font-weight: 600; }
  .qa-card { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; margin: 6px 0 2px; }
  .qa-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .qa-row { display: flex; gap: 10px; align-items: baseline; font-size: 13px; overflow-wrap: anywhere; min-width: 0; }
  .qa-lv { width: 34px; flex: none; font-weight: 600; font-size: 12px; }
  .qa-at { width: 84px; flex: none; font-variant-numeric: tabular-nums; color: var(--muted); }
  .player .pframe { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; pointer-events: none; }
  .player .pbar { flex-wrap: wrap; }
  .player .scrub { pointer-events: auto; position: relative; flex: 1; min-width: 120px; height: 38px; cursor: pointer; touch-action: none;
                   background: rgba(0,0,0,.55); border-radius: 8px; }
  .player .scrub .heat { position: absolute; left: 0; right: 0; top: 2px; height: 20px; width: 100%; overflow: visible; pointer-events: none; }
  .player .scrub .heat path { fill: rgba(255,255,255,.42); }
  .player .scrub .heat circle { fill: var(--accent); stroke: #fff; stroke-width: 1.5; }
  .player .scrub .track { position: absolute; left: 0; right: 0; top: 24px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.28); }
  .player .scrub .shotband { position: absolute; top: 22px; height: 8px; border-radius: 3px; background: var(--accent); opacity: .55; }
  .player .scrub .head { position: absolute; top: 18px; width: 3px; height: 16px; margin-left: -1.5px; border-radius: 2px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.4); }
  .player .best { pointer-events: auto; border: 0; border-radius: 8px; background: rgba(0,0,0,.55); color: #fff; font-size: 11px; padding: 4px 9px; white-space: nowrap; }
  .player .best:hover { background: rgba(0,0,0,.75); }
  .player .scrub .tip { position: absolute; bottom: 36px; transform: translateX(-50%); color: #fff; font-size: 11px; background: rgba(0,0,0,.7); padding: 2px 6px; border-radius: 5px; white-space: nowrap; pointer-events: none; }
  .player .ptime { color: #fff; font-size: 11px; background: rgba(0,0,0,.55); padding: 4px 8px; border-radius: 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .player .capwrap { flex-basis: 100%; display: flex; }
  .search input { min-width: 80px; }
  .find-main { display: flex; flex-direction: column; gap: 12px; padding: 4px 20px 16px; min-width: 0; overflow-y: auto; }

// ---- Music › Find my downloads and Import new (musicfind.py).

// 2. User and context: someone who downloads songs into Downloads all the time and forgets to move them; wants no filing, and no risk of

  };
  if (!PRESET_ID) return;
  const base = `/api/app/styles/presets/${PRESET_ID}`, say = t => { const m = $("#preset-msg"); if (m) m.textContent = t; };
  if ($("#preset-points")) $("#preset-points").onchange = async e => { try { A.style_presets = await post(base + "/points", {points: e.target.value}); say("Saved."); } catch (er) { say(er.message); } };
  if ($("#preset-reset")) $("#preset-reset").onclick = async e => { e.preventDefault(); try { A.style_presets = await post(base + "/reset-points"); paintSettings(false); } catch (er) { say(er.message); } };
  const addRule = async () => { const t = $("#preset-rule").value.trim(); if (!t) return;
    try { A.style_presets = await post(base + "/rule", {text: t}); paintSettings(false); } catch (er) { say(er.message); } };
  $("#preset-rule-add").onclick = addRule; $("#preset-rule").onkeydown = e => { if (e.key === "Enter") addRule(); };
  document.querySelectorAll("[data-rrm]").forEach(b => b.onclick = async () => { try { A.style_presets = await post(base + "/remove-rule", {index: +b.dataset.rrm}); paintSettings(false); } catch (er) { say(er.message); } });
  $("#preset-use").onclick = async () => {
    const b = $("#preset-use"); b.disabled = true;
    try {
      const r = await post(base + "/apply", {mode: STYLE_KIND});
      A.styles = {...A.styles, ...r.styles}; A.style_presets = {presets: r.presets, running: r.running, fetch_url: r.fetch_url};
      paintSettings(false); const m = $("#preset-msg"); if (m) m.textContent = `Done: these lines are now how ${kindWord} are edited. They are listed below, and you can still change them.`;
    } catch (er) { b.disabled = false; say(er.message); }
  };
}

// ---- first-run setup
let SETUP_FORCED = false;
function showSetup(force) { SETUP_FORCED = !!force; paintSetup(); }
function paintSetup() {
  if (!A) return;
  const show = !A.settings.setup.done || SETUP_FORCED;
  $("#setup").hidden = !show;
  if (!show) return;
  if (document.activeElement && $("#setup").contains(document.activeElement) && document.activeElement.tagName === "SELECT") return;
  const steps = A.setup.steps || [], S = A.settings, ai = A.ai, total = steps.filter(s => s.state !== "skipped").reduce((a, s) => a + (s.gb || 0), 0);
  const choice = (id, name, desc, btn, rec) => `<div class="card opt" style="border:1px solid ${S.ai.use === id ? "var(--accent)" : "var(--line)"};border-radius:12px;background:${S.ai.use === id ? "var(--sel)" : "var(--panel)"}">
      <input type="radio" name="sai" value="${id}" ${S.ai.use === id ? "checked" : ""} aria-label="${name}"><div class="grow" style="display:flex;flex-direction:column;gap:4px">
      <div class="row"><b style="font-size:14px">${name}</b>${rec ? `<span class="small" style="font-weight:600;color:var(--link);border:1px solid var(--accent);border-radius:4px;padding:0 6px">Recommended for this Mac</span>` : ""}</div><div class="muted">${desc}</div>${btn ? `<div style="margin-top:6px">${btn}</div>` : ""}</div></div>`;
  const big = A.mac.ram_gb >= 30, c = ai.chatgpt || {}, cl = ai.claude || {};
  const html = `<section style="display:flex;flex-direction:column;gap:16px;min-width:0">
      <div><div style="font-size:22px;font-weight:600">Setting up FirstCut</div><div class="muted" style="margin-top:4px">It downloads what this Mac needs, once: about ${total.toFixed(1)} GB. You can start while the rest finishes: the sidebar shows how far it has got.</div></div>
      <div class="card row" style="gap:22px;padding:12px 14px"><div><div class="meta">This Mac</div><b>${esc(A.mac.chip)}</b></div><div><div class="meta">Memory</div><b>${A.mac.ram_gb} GB</b></div><div><div class="meta">Free disk</div><b>${A.mac.disk_free_gb} GB</b></div></div>
      <div class="card steps">${steps.map(s => `<div class="s"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span class="ell"><b>${esc(s.what)}</b> <span class="muted">· ${esc(s.model)}${s.state === "skipped" ? "" : `, ${s.gb} GB`}</span></span>
          <b style="white-space:nowrap;color:${s.state === "done" ? "var(--good)" : s.state === "failed" ? "var(--bad)" : "var(--muted)"}">${s.state === "running" ? Math.round((s.pct || 0) * 100) + "%" : s.state === "done" ? "Done" : s.state === "failed" ? "Failed" : s.state === "skipped" ? "Not needed" : "Waiting"}</b></div>
          <div class="bar" style="height:4px"><i style="width:${Math.round((s.state === "done" ? 1 : s.pct || 0) * 100)}%"></i></div><div class="meta">${esc(s.state === "failed" ? s.error : s.state === "skipped" ? s.skip : s.state === "running" && s.stage ? s.stage : s.why)}</div></div>`).join("")}</div>
      <div class="row" style="flex-wrap:nowrap"><span class="muted" style="white-space:nowrap">Install the models in</span><span class="path ell grow" style="border:1px solid var(--line)">${esc(S.places.models)}</span><button class="btn" id="su-models">Change…</button></div>
      <div class="small muted">An external drive is fine. Removing that folder and the app removes everything.</div>
    </section>
    <section style="display:flex;flex-direction:column;gap:14px;min-width:0">
      <div><div style="font-size:17px;font-weight:600">Who decides the edit?</div><div class="muted" style="margin-top:4px">Choosing the best moments and where each shot goes needs a capable AI. Transcribing and searching always stay on this Mac.</div></div>
      ${choice("chatgpt", "ChatGPT account", "Sign in with your ChatGPT plan. Nothing extra to download.", c.status === "connected" ? `<span style="color:var(--good);font-weight:600">Connected${c.email ? " as " + esc(c.email) : ""}</span>` : `<button class="btn primary" data-ai-act="chatgpt/connect">${c.status === "connecting" ? "Finish in your browser…" : "Continue with ChatGPT"}</button>`, !big)}
      ${choice("claude", "Claude account", "Sign in with your Claude plan (Pro or Max). Nothing extra to download.", cl.status === "connected" ? `<span style="color:var(--good);font-weight:600">Connected${cl.email ? " as " + esc(cl.email) : ""}</span>` : `<button class="btn" data-ai-act="claude/connect">${cl.status === "installing" ? "Installing…" : cl.status === "signing in" ? "Finish in your browser…" : "Continue with Claude"}</button>`, false)}
      ${choice("local", "On this Mac only", `Downloads ${A.models.text} (${A.models.text_gb} GB). Free and private; on ${A.mac.ram_gb} GB it is ${big ? "good, a bit slower than an account" : "slower and makes weaker choices"}.`, "", big)}
      ${S.ai.use === "local" ? "" : (() => { const acct = S.ai.use === "claude" ? "Claude" : "ChatGPT", w = S.ai.look === "local" ? "local" : "account";
        return `<div><div style="font-size:17px;font-weight:600">Finding your footage</div><div class="muted" style="margin-top:4px">FirstCut looks at every shot and writes down what's in it, so it can find the right B-roll for what's being said.</div></div>
        ${[["account", `Your ${acct} account`, `Fast and cheap: a few seconds a shot. About 150 shots use 1% of a Claude plan's 5-hour window, so a 2,800-shot library is about a fifth of one window. A small contact sheet of each shot is sent to ${acct}.`, true],
           ["local", "This Mac only", "Free and completely private: nothing leaves this Mac. Much slower, about a minute a shot, so a big library takes several nights.", false]].map(([id, name, desc, rec]) =>
          `<label class="card opt" style="border:1px solid ${w === id ? "var(--accent)" : "var(--line)"};border-radius:12px;background:${w === id ? "var(--sel)" : "var(--panel)"};cursor:pointer">
            <input type="radio" name="slook" value="${id}" ${w === id ? "checked" : ""} aria-label="${name}"><div class="grow" style="display:flex;flex-direction:column;gap:4px">
            <div class="row"><b style="font-size:14px">${name}</b>${rec ? `<span class="small" style="font-weight:600;color:var(--link);border:1px solid var(--accent);border-radius:4px;padding:0 6px">Recommended</span>` : ""}</div><div class="muted">${desc}</div></div></label>`).join("")}`; })()}
      <div class="row" style="margin-top:auto;justify-content:space-between"><span class="small muted">You can change all of this any time in Settings.</span>
        <span class="row">${A.setup.running ? "" : `<button class="btn" id="su-start">${steps.some(s => s.state === "failed") ? "Try the failed parts again" : "Download now"}</button>`}<button class="btn primary" id="su-done">${S.setup.done ? "Close" : "Start using FirstCut"}</button></span></div>
    </section>`;
  if (html === SETUP_HTML) return;
  SETUP_HTML = html;
  $("#setup").innerHTML = html;
  document.querySelectorAll("input[name=sai]").forEach(r => r.onchange = () => saveSettings({ai: {use: r.value}}).then(paintSetup));
  document.querySelectorAll("input[name=slook]").forEach(r => r.onchange = () => saveSettings({ai: {look: r.value}, library: {describe_with: r.value}}).then(paintSetup));
  document.querySelectorAll("#setup [data-ai-act]").forEach(b => b.onclick = async () => { b.disabled = true; try { await post("/api/app/ai/" + b.dataset.aiAct); } catch (e) { alert(e.message); } refresh(); });
  $("#su-models").onclick = async () => { const p = await pick("folder", "Choose where to install the AI models", S.places.models); if (p) { await post("/api/app/places", {key: "models", path: p}).catch(e => alert(e.message)); refresh(); } };
  if ($("#su-start")) $("#su-start").onclick = async () => { await post("/api/app/setup/start"); refresh(); };
  $("#su-done").onclick = async () => { if (!A.setup.running && steps.some(s => s.state === "waiting")) await post("/api/app/setup/start"); SETUP_FORCED = false; await saveSettings({setup: {done: true}}); refresh(); };
}

applyAppearance();
refresh().then(() => { if (A && !A.settings.setup.done && !A.setup.running) post("/api/app/setup/start").catch(() => {}); route(false); loadEditors(); loadStyles(); });
</script>
</body>
</html>
