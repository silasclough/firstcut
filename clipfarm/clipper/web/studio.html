<!doctype html>
<!--
  FirstCut (the app, app/VideoBuilder; first called Video Builder) - design notes (CLAUDE.md UI rules). Approved design: https://claude.ai/artifact/8RzjiEL4HzWMdtdbtwtpas ("Chosen direction").
  1. North star: "Say what you're making, drop the footage, press one button" - a long video with B-roll and a Final Cut project, or short
     clips; everything you have made, and what is being made now, is always one click away in the sidebar.
     Home (2026-11-05): "Pick up where you left off" - recent projects as big thumbnails, click to select, double-click or Enter to open
     (like Logic Pro's project chooser); Long form and Short form are the two composers, one kind each (no switch between them).
  2. User and context: an editor at a desk (Final Cut), and a creator friend on a 16 GB M3 who uses ChatGPT skills; neither cares about AI
     settings; the window may be half the screen.
  3. Principles: guide (one primary button per screen), speed (drop anywhere, Enter submits, big targets), explore (options as small menus
     starting from the defaults; everything else in Settings), reassure (progress you can see, plain words, nothing posted anywhere).
  4. Build: sidebar (see-through: the Mac's own sidebar material shows through in the app) + Home composer, long-form project, short clips,
     Find footage, Settings (General, AI, How it edits, Where things go, Footage library), first-run Setup. Follows the Mac's light/dark
     (or the setting); one light-blue accent; system font; works down to 860 px wide.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FirstCut</title>
<style>
  :root {
    --win: #ffffff; --side: rgba(240,242,246,.86); --panel: #ffffff; --field: #f1f3f6; --chip: #e5e9ee; --line: #dde2e8; --thumb: #d3dbe4;
    --text: #16202c; --muted: #5b6776; --accent: #5aa9e6; --on-accent: #0b1b2b; --link: #1d6aa8; --sel: rgba(22,32,44,.07); --seg: #ffffff;
    --good: #2f7a4b; --warn: #8a5a00; --bad: #b3322b; --scrim: rgba(22,32,44,.30); --radius: 12px;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; color-scheme: light;
  }
  :root[data-theme="dark"] {
    --win: #0a0b0d; --side: rgba(8,9,11,.9); --panel: #15171a; --field: #1e2125; --chip: #2a2e34; --line: #2a2e34; --thumb: #23272d;
    --text: #f3f4f6; --muted: #9ba4b0; --accent: #7dbdf0; --link: #8fc8f3; --sel: rgba(255,255,255,.08); --seg: #3a3f47;
    --good: #8fc79a; --warn: #e0b45c; --bad: #ef8c84; --scrim: rgba(0,0,0,.5); color-scheme: dark;
  }
  :root.native { --side: rgba(255,255,255,.18); }
  :root.native[data-theme="dark"] { --side: rgba(0,0,0,.42); }
  /* Liquid Glass (macOS 26+): the app draws a glass panel 8 px in from the window's left, top and bottom edges, 224 wide; the sidebar
     sits on it, see-through, and the window's blurred backdrop shows in the 8 px around it */
  :root.glass { --side: transparent; }
  :root.glass #side { border-right: 0; padding: 52px 18px 18px; }
  :root.glass main { margin: 0; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  .shots-wrap { display: flex; flex-direction: column; gap: 8px; }
  .shots-wrap:empty { display: none; }
  .rp-search { display: flex; align-items: center; gap: 8px; margin: 0 20px 10px; padding: 0 6px 0 12px; height: 40px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); }
  .rp-search:focus-within { border-color: var(--accent); }
  .rp-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; color: var(--text); height: 100%; }
  .broll-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .shot-t { flex: 0 0 auto; width: 128px; display: flex; flex-direction: column; gap: 4px; }
  .shot-pic { position: relative; width: 128px; aspect-ratio: 16 / 9; padding: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--sel); cursor: pointer; }
  .shot-pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shot-pic .badge { position: absolute; right: 4px; bottom: 4px; }
  .shot-pic .badge.l { left: 4px; right: auto; }
  .shot-t.on .shot-pic { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .shot-rep { height: 26px; font-size: 12px; justify-content: center; }
  .rp-list { flex: 1; overflow-y: auto; padding: 0 20px 12px; display: flex; flex-direction: column; gap: 8px; }
  .rp-row { display: flex; align-items: center; gap: 12px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; cursor: pointer; font: inherit; }
  .rp-row:hover { background: var(--sel); }
  .rp-pic { flex: 0 0 auto; width: 128px; aspect-ratio: 16 / 9; border-radius: 4px; overflow: hidden; background: var(--sel); }
  .rp-pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .rp-what { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 13px; line-height: 1.35; margin-bottom: 2px; }
  .rp-row .rp-use { flex: 0 0 auto; height: 30px; pointer-events: none; }
  .rp-row:hover .rp-use, .rp-row:focus-visible .rp-use { background: var(--accent); border-color: var(--accent); color: var(--on-accent, #fff); }
.tx-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.tx-row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.tx-row:hover{background:var(--hover,rgba(127,127,127,.08))}
.tx-row .tiny-bar{grid-column:1/-1}
.tx-text p{display:grid;grid-template-columns:52px 1fr;gap:0 12px;margin:0 0 14px;line-height:1.6;font-size:15px;user-select:text;-webkit-user-select:text}
.tx-t{padding-top:3px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;user-select:none;-webkit-user-select:none}
  a, img, svg, button { -webkit-user-drag: none; user-drag: none; }          /* an app, not a page: links and pictures don't drag out */
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }   /* ...and its words don't select like a page's */
  input, textarea, .err, .path, .selectable { -webkit-user-select: text; user-select: text; }
  .ctx { position: fixed; z-index: 30; min-width: 210px; padding: 5px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); box-shadow: 0 8px 28px rgba(0,0,0,.28); display: flex; flex-direction: column; }
  .ctx button { text-align: left; padding: 6px 10px; border: 0; border-radius: 6px; background: transparent; }
  .ctx button:hover, .ctx button:focus-visible { background: var(--accent); color: var(--on-accent); outline: none; }
  .ctx button.danger { color: var(--bad); }
  .ctx button.danger:hover { color: var(--on-accent); }
  .toast { position: fixed; z-index: 40; left: 50%; bottom: 22px; transform: translateX(-50%); max-width: min(560px, calc(100% - 40px)); padding: 12px 16px; box-shadow: 0 8px 28px rgba(0,0,0,.28); }
  .styles { flex: 1; overflow-y: auto; padding: 4px 20px 16px; display: flex; flex-direction: column; gap: 10px; }
  .style-row { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; cursor: default; }
  .style-row:hover { background: var(--sel); }
  .style-row.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .style-shots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .style-shots img { width: 100%; aspect-ratio: 16 / 9; border-radius: 6px; background: var(--thumb); display: block; }
  .menu { max-height: min(420px, 70vh); overflow-y: auto; min-width: 180px; }
  .menu button { display: grid; grid-template-columns: 16px 1fr; gap: 6px; align-items: center; }
  .menu button .ck { font-size: 12px; }
  .chip { cursor: pointer; }
  .chip:hover { background: var(--sel); }
  .chip.open { border-color: var(--accent); }
  .page-songs { padding: 0; overflow: visible; }
  .lic { flex: none; font-size: 11px; padding: 2px 7px; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); }
  .song-curve { position: relative; flex: none; width: 160px; height: 22px; }
  .song-curve svg { width: 100%; height: 100%; display: block; } .song-curve path { fill: var(--accent); opacity: .5; }
  .song-curve i { position: absolute; top: 2px; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 1.5px var(--panel); }
  @media (max-width: 1000px) { .song-curve { display: none; } }
  .songs { flex: 1; overflow-y: auto; padding: 4px 20px 12px; display: flex; flex-direction: column; gap: 6px; }
  .song { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 12px; }
  /* the scrub bar: the song's waveform; played part in the accent, a playhead; click or drag to jump */
  .wave { position: relative; flex: 1 1 160px; min-width: 120px; max-width: 360px; height: 30px; cursor: pointer; touch-action: none; border-radius: 4px; }
  .wave .wbars, .wave .wbars > * { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .wave .wbars svg { width: 100%; height: 100%; }
  .wave.real .wbars svg rect { fill: var(--muted); opacity: .55; }
  .wave.on.real .wbars svg { -webkit-mask: linear-gradient(90deg, #000 var(--played, 0%), rgba(0,0,0,.45) var(--played, 0%)); mask: linear-gradient(90deg, #000 var(--played, 0%), rgba(0,0,0,.45) var(--played, 0%)); }
  .wave.on.real .wbars svg rect { fill: var(--accent); opacity: 1; }
  .wave .whead { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--text, currentColor); border-radius: 1px; left: 0; display: none; }
  .wave.on .whead { display: block; }
  .wave:not(.real) { border-bottom: 1px solid var(--line); }
  .wave:hover { background: rgba(127,127,127,.06); }
  .wave .song-curve { display: block !important; width: 100%; height: 100%; }
  .stock-key { grid-column: 1 / -1; padding: 10px 14px; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 6px; font-size: 13px; color: var(--muted); }
  .stock-key b { color: var(--text); font-weight: 600; }
  .stock-key a { margin-left: 6px; white-space: nowrap; }
  .cn-step { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; }
  .snip { position: relative; display: flex; gap: 8px; align-items: flex-start; }
  .snip pre { flex: 1; min-width: 0; margin: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg, transparent);
              font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-all; user-select: text; -webkit-user-select: text; }
  .use-pop { position: fixed; z-index: 60; width: 240px; padding: 14px; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--line);
             border-radius: 12px; background: var(--panel); box-shadow: 0 8px 28px rgba(0,0,0,.28); pointer-events: none; }
  html.glass .use-pop { background: color-mix(in srgb, var(--panel) 86%, transparent); backdrop-filter: blur(20px) saturate(1.3); -webkit-backdrop-filter: blur(20px) saturate(1.3); }
  .up-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .up-rings { display: flex; justify-content: space-around; gap: 8px; }
  .up-ring { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
  .up-ring b { font-size: 12px; }
  .up-other { display: flex; flex-direction: column; gap: 4px; padding-top: 8px; border-top: 1px solid var(--line); }
  .up-bar { display: grid; grid-template-columns: 48px 1fr 34px; align-items: center; gap: 8px; }
  .up-speed { display: flex; align-items: baseline; gap: 8px; }
  .up-big { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .up-spark { width: 100%; height: 28px; }
  .mbar { position: sticky; bottom: 0; z-index: 5; display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 10px 12px;
          border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
  .mbar .wave { max-width: none; }
  html.glass .mbar { background: color-mix(in srgb, var(--panel) 82%, transparent); backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3); }
  .song:hover { background: var(--sel); }
  .song-play { width: 32px; height: 32px; flex: none; border-radius: 50%; border: 0; background: var(--field); color: var(--text); display: flex; align-items: center; justify-content: center; }
  .song-energy { flex: none; } .song-energy path { fill: var(--accent); opacity: .55; }
  .ctx hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }
  html, body { margin: 0; height: 100%; }
  body { background: transparent; color: var(--text); overflow: hidden; }
  :root:not(.native) body { background: #dfe5ec; }
  :root:not(.native)[data-theme="dark"] body { background: #000; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--link); }
  textarea::placeholder, input::placeholder { color: var(--muted); opacity: .85; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .app { display: flex; height: 100vh; }
  /* sidebar */
  #side { width: 240px; flex: none; display: flex; flex-direction: column; padding: 52px 10px 12px; background: var(--side); border-right: 1px solid var(--line); overflow: hidden; }
  .nav a, .side-row { display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 0 10px; border-radius: 8px; color: var(--text); text-decoration: none; }
  .nav a.on { background: var(--sel); font-weight: 600; }
  body.dragging-shots .nav a[data-nav="long"], body.dragging-shots .nav a[data-nav="short"] { outline: 1px dashed var(--accent); outline-offset: -1px; }
  .nav a.drop { background: var(--accent) !important; color: var(--on-accent) !important; }
  .shot[draggable=true] { cursor: grab; }
  .nav a:hover, .side-list a:hover { background: var(--sel); }
  .side-h { margin: 18px 10px 6px; font-size: 11px; font-weight: 600; color: var(--muted); }
  .side-list { display: flex; flex-direction: column; gap: 1px; min-height: 0; overflow-y: auto; }
  .side-list a { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 8px; color: var(--text); text-decoration: none; }
  .side-list a.on { background: var(--sel); }
  .side-list a.mk { display: flex; flex-direction: column; align-items: stretch; gap: 5px; padding: 8px 10px; border-radius: 8px; color: var(--text); text-decoration: none; }
  .mk:hover { background: var(--sel); }
  .tiny-bar { display: block; width: 100%; height: 3px; border-radius: 2px; background: var(--chip); overflow: hidden; }
  .tiny-bar i { display: block; height: 100%; background: var(--accent); }
  .tw { width: 32px; height: 20px; flex: none; display: flex; align-items: center; justify-content: center; }
  .tw span { display: block; border-radius: 3px; background: var(--thumb); }
  .ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .meta { font-size: 11px; color: var(--muted); }
  .side-foot { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 4px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .ai-box { display: flex; flex-direction: column; gap: 5px; padding: 7px 10px; border-radius: 8px; color: var(--text); text-decoration: none; font-size: 12px; }
  .ai-box:hover { background: var(--sel); }
  .out-card { display: flex; flex-direction: column; gap: 5px; padding: 10px 12px; margin-bottom: 6px; border-color: var(--warn); font-size: 12px; }
  .upd-card { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; margin-bottom: 6px; font-size: 12px; }
  .upd-card details summary { cursor: pointer; color: var(--muted); list-style: none; } .upd-card details summary::-webkit-details-marker { display: none; }
  .upd-card .upd-notes { max-height: 120px; overflow: auto; color: var(--muted); line-height: 1.45; }
  .use-row { display: grid; grid-template-columns: 58px minmax(0, 1fr) 32px; align-items: center; gap: 8px; font-size: 11px; }
  .use-row > span:last-child { text-align: right; }

  /* main */
  main { flex: 1; min-width: 0; background: var(--win); display: flex; flex-direction: column; overflow: hidden; }
  .top { height: 52px; flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px 0; }
  .view { flex: 1; min-height: 0; overflow-y: auto; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -.01em; }
  h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .grow { flex: 1; }
  .btn { height: 32px; padding: 0 14px; border: 0; border-radius: 9px; background: var(--field); color: var(--text); white-space: nowrap; }
  .btn:hover { filter: brightness(.97); }
  .btn.primary { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn.quiet { background: transparent; border: 1px solid var(--line); }
  .btn.danger { color: var(--bad); }
  .btn:disabled { opacity: .5; cursor: default; }
  .seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--field); }
  .seg button { height: 28px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; font-weight: 600; }
  .seg button.on { background: var(--seg); box-shadow: 0 0 0 1px var(--line); }
  .chip { position: relative; flex: none; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 26px 0 10px; border: 1px solid var(--line); border-radius: 10px; }
  .chip .k { color: var(--muted); }
  .chip select { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .chip::after { content: ""; position: absolute; right: 10px; top: 12px; width: 6px; height: 6px; border-right: 1.4px solid currentColor; border-bottom: 1.4px solid currentColor; transform: rotate(45deg); opacity: .7; }
  .card { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
  .bar { height: 5px; border-radius: 3px; background: var(--chip); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); transition: width .6s ease; }
  .err { color: var(--bad); white-space: pre-wrap; }
  .field { width: 100%; height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--field); color: var(--text); }

  /* home: recent projects */
  .recent { padding: 2px 24px 28px; display: flex; flex-direction: column; gap: 16px; min-height: 100%; }
  .suggest { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .sug { display: flex; gap: 12px; align-items: flex-start; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text); }
  .sug:hover { background: var(--sel); border-color: var(--accent); }
  .sug svg { flex: none; margin-top: 1px; color: var(--accent); }
  .sug b { display: block; font-size: 13.5px; } .sug .small { display: block; margin-top: 2px; }
  .picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .pick-t { position: relative; padding: 0; border: 0; border-radius: 9px; overflow: hidden; aspect-ratio: 16 / 9; background: var(--thumb); }
  .pick-t img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pick-t:hover { box-shadow: 0 0 0 2px var(--accent); }
  .new-bar { padding: 10px 10px 10px 16px; border-color: var(--accent); flex-wrap: nowrap; }
  .compose-recent { width: 100%; max-width: 1000px; margin-top: 34px; display: flex; flex-direction: column; gap: 12px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
  .tile { display: flex; flex-direction: column; gap: 6px; padding: 7px; border-radius: 14px; user-select: none; -webkit-user-select: none; cursor: default; outline: none; }
  .tile:hover { background: var(--sel); }
  .tile.sel { background: var(--sel); box-shadow: 0 0 0 2px var(--accent); }
  .tile .t { position: relative; aspect-ratio: 16 / 9; border-radius: 9px; background: var(--thumb); overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 3px; color: var(--muted); }
  .tile .t img { height: 100%; display: block; object-fit: cover; }
  .tile .t img.wide { width: 100%; }
  .tile .t img.tall { aspect-ratio: 9 / 16; }
  .tile .t .tiny-bar { position: absolute; left: 8px; right: 8px; bottom: 8px; width: auto; height: 4px; background: rgba(0,0,0,.45); }
  .tile b { font-size: 13px; }
  .actbar { position: sticky; bottom: 0; margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 16px; }
  .home-find { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; max-width: 520px; }
  .home-find input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 14px; }

  /* composer */
  .modes { width: 100%; max-width: 760px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  @media (max-width: 720px) { .modes { grid-template-columns: 1fr; } }
  .mode { display: flex; gap: 12px; align-items: flex-start; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text); }
  .mode svg { flex: none; margin-top: 2px; color: var(--muted); }
  .mode:hover { background: var(--sel); }
  .mode.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .mode.on svg { color: var(--accent); }
  .mode b { display: block; font-size: 14px; }
  .mode .small { display: block; margin-top: 2px; }

function paintHome() {

        ${pickedHTML()}</div>`;
    bindSuggest(); bindPicked();

  }

  if (!both) HOME_KIND = "";

  if (!shown.some(i => i.href === HOME_SEL)) HOME_SEL = "";

  const layout = JSON.stringify([HOME_KIND, both, L.videos || 0, shown.map(i => [i.href, i.title, i.thumbs, BUSY.includes(i.status)]), A.settings.library.picked]);

      </div>
      <div class="tiles" role="listbox" aria-label="Recent projects">${shown.map(tileHTML).join("")}</div>
      ${pickedHTML()}
      <div class="card actbar" id="home-act" ${HOME_SEL ? "" : "hidden"}></div>
    </div>`;

  document.querySelectorAll("[data-hk]").forEach(b => b.onclick = () => { HOME_KIND = b.dataset.hk; LAST = ""; route(); });
  if ($("#home-q")) $("#home-q").onkeydown = e => { if (e.key === "Enter" && e.target.value.trim()) { FIND.q = e.target.value.trim(); FIND.shots = []; location.hash = "#find"; setTimeout(search, 0); } };
  const pickTile = el => { HOME_SEL = el.dataset.href; document.querySelectorAll(".tile").forEach(t => { t.classList.toggle("sel", t === el); t.setAttribute("aria-selected", t === el); }); paintHomeActions(); };

  $("#view .recent").dataset.layout = layout;

function paintHomeActions() {
  const bar = $("#home-act"); if (!bar) return;
  const i = items().find(x => x.href === HOME_SEL);
  bar.hidden = !i; if (!i) return;
  const done = i.status === "done", key = JSON.stringify([i.href, i.title, i.status, !!i.folder]);
  if (bar.dataset.key === key) return;
  bar.dataset.key = key;
  bar.innerHTML = `<span class="ell grow"><b>${esc(i.title)}</b> <span class="muted small">· double-click to open</span></span>
    ${i.folder ? `<button class="btn" id="h-reveal">Show in Finder</button>` : ""}${i.kind === "long" && done ? openInButtons("h", false) : ""}<button class="btn primary" id="h-open">Open</button>`;
  $("#h-open").onclick = () => { location.hash = i.href; };
  if ($("#h-reveal")) $("#h-reveal").onclick = () => (i.kind === "long" ? post(`/api/ai/projects/${i.id}/reveal`) : showFolder(i.folder + "/Clips")).catch(e => alert(e.message));
  bindOpenIn(i.id);
}

function optValue(mode, k, base, changed) {
  const d = base || A.settings.defaults[mode] || {}, o = changed || COMPOSE.opts[mode];
  if (k in o) return o[k];
  if (k === "len") return `${Math.round(d.min_len || 20)}-${Math.round(d.max_len || 35)}`;
  return d[k];
}
function chipsHTML(mode, scope, base, changed) {
  const val = k => optValue(mode, k, base, changed);
  return OPT[mode].filter(o => !o.when || o.when(val, scope)).map(o => {
    const choices = typeof o.choices === "function" ? o.choices() : o.choices;
    const v = val(o.k), cur = choices.find(c => String(c[0]) === String(v)) || choices[0];
    return `<label class="chip"><span class="k">${o.label}</span>${esc(cur[1])}<select data-opt="${scope}:${mode}:${o.k}" aria-label="${o.label}">${choices.map(c => `<option value="${esc(c[0])}" ${String(c[0]) === String(cur[0]) ? "selected" : ""}>${esc(c[1])}</option>`).join("")}</select></label>`;
  }).join("") + (mode === "long" && val("graphics") ? `<button class="btn quiet" data-styles="${scope}" style="height:30px">See the styles…</button>` : "");
}

    case "words": if (LIVE.of !== e.of) { LIVE.of = e.of; LIVE.queue.push(null); } e.words.forEach(w => LIVE.queue.push(w[0])); d.words += e.words.length; return;
    case "transcribed": return liveLog(`Heard ${e.count.toLocaleString()} words in ${e.of}${e.minutes ? ` (${e.minutes} min of talking)` : ""}`, e.t);
    case "frame": if (!e.f) return; keep(d.frames, e, 24); return liveLog(`Frame at ${mmss(e.t || 0)} of ${e.of}${e.what ? ": " + e.what : ""}`, e.t);
    case "sheet": if (!e.f) return; keep(d.sheets, e, 4); return liveLog(`Looking at ${e.frames} frames of ${e.of}`, e.t);
    case "scene": keep(d.scenes, e, 40); return liveLog(`${e.of} ${span(e.start, e.end)}: ${e.what}`, e.t);
    case "libshot": keep(d.libshots, e, 24); return liveLog(`From your library: ${e.what}${e.rel ? ` (${e.rel})` : ""}`, e.t);
    case "moment": keep(d.moments, e, 40); return liveLog(`Candidate “${e.title}” ${span(e.start, e.end)}, score ${e.score}`, e.t);
    case "pick": d.picked = new Set((e.moments || []).map(m => m.start + ":" + m.end)); return liveLog(`Picked ${e.moments.length} moment${e.moments.length === 1 ? "" : "s"}: ${e.moments.map(m => "“" + m.title + "”").join(", ")}`, e.t);
    case "line": keep(d.lines, e, 40); return liveLog(`Keeps ${span(e.start, e.end)}: “${e.text}”`, e.t);
    case "broll": keep(d.broll, e, 40); return liveLog(`B-roll at ${mmss(e.at)} for ${e.length} s: ${e.what || e.of}`, e.t);
    case "render": d.render = e; return liveLog(`Making clip ${e.index} of ${e.of}: “${e.title}” (${span(e.start, e.end)})`, e.t);
    case "clip": keep(d.clips, e, 40); return liveLog(`Finished clip ${e.index}: “${e.title}”${e.duration ? `, ${mmss(e.duration)}` : ""}`, e.t);
    default: if (e.text) liveLog(e.text, e.t);
  }
}
function liveType() {                                         // the heard words, typed out (faster when many are waiting)
  if (!LIVE.queue.length) return;
  for (let k = Math.max(1, Math.ceil(LIVE.queue.length / 90)); k > 0 && LIVE.queue.length; k--) {
    const w = LIVE.queue.shift();
    if (w === null) LIVE.typed = []; else LIVE.typed.push(w);
  }
  if (LIVE.typed.length > 160) LIVE.typed.splice(0, LIVE.typed.length - 160);
  liveWords();
}
function liveWords() {
  const box = lvq("#lv-words"); if (!box) return;
  const t = LIVE.typed, last = t.length - 1;
  box.innerHTML = `<div>${t.slice(0, last).map(esc).join(" ")} <b>${esc(t[last] || "")}</b></div>`;
  const h = lvq("#lv-words-of"); if (h) h.textContent = LIVE.of;
}
function liveNow() {                                          // the latest three things it worked on, newest first
  const d = LIVE.d, now = lvq("#lv-now"); if (!now) return;
  const anim = n => n > LIVE.seen ? "lv-in" : "";
  const fig = (x, cap) => `<figure class="${anim(x.n)}"><img alt="" loading="lazy" src="${lvImg(x.f)}"><figcaption>${esc(cap)}</figcaption></figure>`;
  const S = {
    source: () => d.source && `<div class="lv-src">${d.source.thumb ? `<img alt="" src="${esc(d.source.thumb)}" onerror="this.remove()">` : ""}<div style="min-width:0">
        <b class="ell" style="display:block;font-size:14px">${esc(d.source.title || "The video")}</b><div class="meta">${esc([d.source.uploader, d.source.duration ? mmss(d.source.duration) : "", d.source.site].filter(Boolean).join(" · "))}</div>
        ${d.dl && d.dl.total ? `<div class="meta" style="margin-top:6px">${(d.dl.got / 1e6).toFixed(1)} of ${(d.dl.total / 1e6).toFixed(0)} MB${d.dl.speed ? ` · ${(d.dl.speed / 1e6).toFixed(1)} MB/s` : ""}${d.dl.eta != null ? ` · ${mmss(d.dl.eta)} left` : ""}</div>` : ""}</div></div>`,
    words: () => d.words && `<h3>Hearing the words <span class="ell" id="lv-words-of">${esc(LIVE.of)}</span><span>${d.words.toLocaleString()} words so far</span></h3><div class="lv-words" id="lv-words"></div>`,
    frames: () => d.frames.length && `<h3>Frames it is looking at</h3><div class="lv-strip" id="lv-strip">${d.frames.map(x => fig(x, `${mmss(x.t || 0)} · ${x.what || x.of}`)).join("")}</div>`,
    sheets: () => d.sheets.length && (() => { const sh = d.sheets[d.sheets.length - 1], sc = d.scenes.filter(x => x.of === sh.of).slice(-8);
      return `<h3>Looking at <span class="ell">${esc(sh.of)}</span></h3><div class="lv-sheet"><img class="${anim(sh.n)}" alt="" src="${lvImg(sh.f)}">
        <div class="lv-list">${sc.length ? sc.map(x => `<div class="lv-item ${anim(x.n)}"><span class="meta">${mmss(x.start)}–${mmss(x.end)}${x.quality ? ` · quality ${x.quality}` : ""}</span><span>${esc(x.what)}</span></div>`).join("") : `<span class="small muted">Describing what is in each shot…</span>`}</div></div>`; })(),
    libshots: () => d.libshots.length && `<h3>Found in your footage library</h3><div class="lv-grid">${d.libshots.slice(-12).map(x => fig(x, x.what || x.rel)).join("")}</div>`,
    moments: () => d.moments.length && `<h3>Moments it found <span>${d.moments.length}</span></h3><div class="lv-list">${d.moments.slice().reverse().map(x => {
        const on = d.picked && d.picked.has(x.start + ":" + x.end);
        return `<div class="lv-item ${on ? "picked" : ""} ${anim(x.n)}"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b class="ell">${esc(x.title)}</b>
          <span class="meta" style="white-space:nowrap">${on ? "Picked · " : ""}${mmss(x.start)}–${mmss(x.end)} · ${Math.round(x.end - x.start)} s · ${x.score}</span></div>
          ${x.quote ? `<span class="q">“${esc(x.quote)}”</span>` : ""}<div class="lv-score"><i style="width:${Math.max(0, Math.min(100, x.score * 10))}%"></i></div></div>`; }).join("")}</div>`,
    lines: () => d.lines.length && `<h3>Lines it keeps <span>${d.lines.length}</span></h3><div class="lv-list">${d.lines.map(x => `<div class="lv-item ${anim(x.n)}"><span class="meta">${mmss(x.start)}–${mmss(x.end)}</span><span>“${esc(x.text)}”</span></div>`).join("")}</div>`,
    broll: () => d.broll.length && `<h3>B-roll it places over the talking <span>${d.broll.length}</span></h3><div class="lv-grid">${d.broll.map(x => fig(x, `at ${mmss(x.at)} · ${x.length} s · ${x.what || x.of}`)).join("")}</div>`,
    clips: () => d.render && `<h3>Making the clips <span>${d.clips.length} of ${d.render.of} done</span></h3>      ${/* (the finished ones are listed under this panel) */ ""}
      <div class="lv-item ${anim(d.render.n)}"><span class="meta">Clip ${d.render.index} of ${d.render.of} · ${mmss(d.render.start)}–${mmss(d.render.end)} of the video</span><b>${esc(d.render.title)}</b></div>`,
  };
  const order = Object.keys(S).filter(k => d.upd[k]).sort((a, b) => d.upd[b] - d.upd[a]).slice(0, 3);

  now.querySelectorAll(".lv-in").forEach(el => el.addEventListener("animationend", () => el.classList.remove("lv-in"), {once: true}));
  LIVE.seen = LIVE.after;
  liveWords();
}

// ---- the B-roll in a finished long video: see each shot, jump to it, swap one you don't like
// North star: "Don't like a shot? Replace it." The strip is quiet (small pictures under the player); one clear action per shot.
const BROLL = {};                                                          // pid -> {key, job, shots, err}
async function paintBroll(p) {
  const box = $("#l-shots"); if (!box) return;
  const key = p.id + ":" + (p.clip && p.clip.rendered_at);
  const draw = () => {
    const d = BROLL[p.id];
    if (!d || d.key !== key) { box.innerHTML = ""; return; }
    if (d.err || !d.shots.length) { box.innerHTML = d.err ? `<div class="small muted">${esc(d.err)}</div>` : ""; return; }
    box.innerHTML = `<div class="row" style="justify-content:space-between"><span class="small" style="font-weight:600">B-roll in this video</span><span class="small muted">Click a shot to see it; Replace swaps just that one.</span></div>
      <div class="broll-strip" role="list">${d.shots.map(x => `<div class="shot-t" role="listitem" data-k="${x.k}" data-at="${x.at}" data-end="${x.at + x.length}">
        <button class="shot-pic" data-seek="${x.at}" aria-label="Go to ${esc(x.what || "this shot")} at ${mmss(x.at)}" title="${esc(x.what)}">${x.thumb ? `<img alt="" loading="lazy" src="/media/${d.job}/${x.thumb}">` : ""}<span class="badge">${mmss(x.at)}</span>${x.photo ? `<span class="badge l">Photo</span>` : ""}</button>
        <button class="btn quiet shot-rep" data-rep="${x.k}">Replace…</button></div>`).join("")}</div>`;
    box.querySelectorAll("[data-seek]").forEach(b => b.onclick = () => { const v = $(".lf-video"); if (v) { v.currentTime = +b.dataset.seek + 0.05; v.play().catch(() => {}); } });
    box.querySelectorAll("[data-rep]").forEach(b => b.onclick = () => openReplace(p, +b.dataset.rep));
    const v = $(".lf-video");
    if (v) v.ontimeupdate = () => { const t = v.currentTime; box.querySelectorAll(".shot-t").forEach(el => el.classList.toggle("on", t >= +el.dataset.at && t < +el.dataset.end)); };
  };
  draw();
  if (BROLL[p.id] && BROLL[p.id].key === key) return;
  try { const r = await api(`/api/app/long/${p.id}/shots`); BROLL[p.id] = {key, job: r.job, shots: r.shots || []}; }
  catch (e) { BROLL[p.id] = {key, shots: [], err: /once more first|ad's B-roll/.test(e.message) ? e.message.replace(/^./, x => x.toUpperCase()) + "." : ""}; }
  draw();
}
async function openReplace(p, k) {
  const m = $("#sheet"), d = BROLL[p.id] || {}, cur = (d.shots || []).find(x => x.k === k) || {};
  const close = () => { m.hidden = true; m.innerHTML = ""; document.removeEventListener("keydown", esc4); };
  const esc4 = e => { if (e.key === "Escape") close(); };
  m.innerHTML = `<div class="dialog" role="dialog" aria-label="Replace this shot" style="flex-direction:column;height:min(640px,100%);width:min(720px,100%)">
      <div class="row" style="padding:16px 20px 6px;justify-content:space-between;align-items:flex-start"><div><h2 style="font-size:17px">Replace the shot at ${mmss(cur.at || 0)}</h2>
        <div class="small muted ell" style="max-width:560px">Now: ${esc(cur.what || "")}</div></div>
        <button class="x" id="rp-close" aria-label="Close" style="background:transparent;font-size:18px">×</button></div>
      <div class="small muted" id="rp-said" style="padding:0 20px 8px"></div>
      <div class="rp-search"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
        <input id="rp-q" type="search" autocomplete="off" placeholder="Search your footage, e.g. students walking to class" aria-label="Search for another shot">
        <button class="mic mic-in" id="rp-mic" aria-label="Dictate: say what you want" title="Say it instead of typing (the words are worked out on this Mac)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="5.5" y="1.5" width="5" height="8.5" rx="2.5"/><path d="M3 7.5a5 5 0 0 0 10 0M8 12.5v2.5"/></svg><span class="mic-t" hidden></span></button></div>
      <div class="rp-list" role="list"><div class="small muted" style="padding:14px 20px">Finding shots that fit…</div></div>
      <div class="row" style="padding:12px 20px;border-top:1px solid var(--line);justify-content:space-between"><span class="small muted">Only this shot changes; the video renders again.</span>
        <button class="btn" id="rp-speaker">Show the speaker instead</button></div></div>`;
  m.hidden = false;
  m.onclick = e => { if (e.target === m) close(); };
  document.addEventListener("keydown", esc4);
  $("#rp-close").onclick = close;
  const use = async (choice, b) => {
    b.disabled = true;
    try { await post(`/api/app/long/${p.id}/shots/${k}`, {choice}); close(); delete BROLL[p.id]; toast(choice === "speaker" ? "Taking that shot out: the video is rendering again." : "Swapping the shot: the video is rendering again."); refresh(); }
    catch (e) { b.disabled = false; alert(e.message); }
  };
  $("#rp-speaker").onclick = e => use("speaker", e.currentTarget);
  const list = m.querySelector(".rp-list");
  // one list for both: the suggestions (empty box) and search results; a result from the footage library says which folder
  const paint = (rows, empty) => {
    list.innerHTML = rows.length ? rows.map(x => `<button class="rp-row" role="listitem" data-choice="${esc(String(x.choice))}">
        <span class="rp-pic">${x.pic || x.thumb ? `<img alt="" loading="lazy" src="${esc(x.pic || `/media/${d.job}/${x.thumb}`)}">` : ""}</span>
        <span class="grow" style="min-width:0;text-align:left"><span class="rp-what">${esc(x.what || "A shot")}</span><span class="small muted">${x.where === "library" ? `From your library · ${esc(x.folder || "")} · ` : x.where === "project" ? "In this project · " : ""}${x.photo ? "Photo · " : ""}${x.length.toFixed(1)} s</span></span>
        <span class="btn rp-use">Use this</span></button>`).join("") : `<div class="small muted" style="padding:14px 20px">${empty}</div>`;
    list.querySelectorAll("[data-choice]").forEach(b => b.onclick = () => { const v = b.dataset.choice; use(/^\d+$/.test(v) ? +v : v, b); });
  };
  let sugg = null, seq = 0;

    list.innerHTML = `<div class="small muted" style="padding:14px 20px">Searching…</div>`;
    try {
      const r = await api(`/api/app/long/${p.id}/shots/${k}/search?q=${encodeURIComponent(q)}`);

    } catch (e) { if (n === seq) list.innerHTML = `<div class="err small" style="padding:14px 20px">${esc(e.message)}</div>`; }

function bindStockScrub(p, v) {                                            // over the preview only (that's all there is to watch)

let MIC = null;
function bindMic(btn, box, onText) {

  const label = btn.querySelector(".mic-t");
  const done = () => { if (MIC) { clearInterval(MIC.tick); MIC.stream.getTracks().forEach(t => t.stop()); } MIC = null; btn.classList.remove("rec"); label.hidden = true; };
  btn.onclick = async () => {
    if (MIC && MIC.btn === btn) { MIC.rec.stop(); return; }                // second click: stop and write it down
    if (MIC) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio: true});
      const type = MediaRecorder.isTypeSupported("audio/mp4") ? "audio/mp4" : "";

      btn.classList.add("rec"); label.hidden = false; label.textContent = "0:00"; btn.setAttribute("aria-label", "Stop and write it down");
      rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };

        if (cancelled || !chunks.length) return;

          const r = await api("/api/app/dictate", {method: "POST", headers: {"Content-Type": blob.type}, body: blob});
          if (r.text) { const cur = box.value.trim(); box.value = (cur ? cur + (/[.!?]$/.test(cur) ? " " : ". ") : "") + r.text; onText(box.value); box.focus(); }
          else toast("Didn't catch any words. Try again a little closer to the microphone.");
        } catch (e) { toast(e.message); }
        btn.classList.remove("busy"); label.hidden = true;
      };
      rec.start();

  };
}

    <section style="display:flex;flex-direction:column;gap:14px;min-width:0">
      <div><div style="font-size:17px;font-weight:600">Who decides the edit?</div><div class="muted" style="margin-top:4px">Choosing the best moments and where each shot goes needs a capable AI. Transcribing and searching always stay on this Mac.</div></div>
      ${choice("chatgpt", "ChatGPT account", "Sign in with your ChatGPT plan. Nothing extra to download.", c.status === "connected" ? `<span style="color:var(--good);font-weight:600">Connected${c.email ? " as " + esc(c.email) : ""}</span>` : `<button class="btn primary" data-ai-act="chatgpt/connect">${c.status === "connecting" ? "Finish in your browser…" : "Continue with ChatGPT"}</button>`, !big)}
      ${choice("claude", "Claude account", "Sign in with your Claude plan (Pro or Max). Nothing extra to download.", cl.status === "connected" ? `<span style="color:var(--good);font-weight:600">Connected${cl.email ? " as " + esc(cl.email) : ""}</span>` : `<button class="btn" data-ai-act="claude/connect">${cl.status === "installing" ? "Installing…" : cl.status === "signing in" ? "Finish in your browser…" : "Continue with Claude"}</button>`, false)}
      ${choice("local", "On this Mac only", `Downloads ${A.models.text} (${A.models.text_gb} GB). Free and private; on ${A.mac.ram_gb} GB it is ${big ? "good, a bit slower than an account" : "slower and makes weaker choices"}.`, "", big)}
      ${S.ai.use === "local" ? "" : (() => { const acct = S.ai.use === "claude" ? "Claude" : "ChatGPT", w = S.ai.look === "local" ? "local" : "account";
        return `<div><div style="font-size:17px;font-weight:600">Finding your footage</div><div class="muted" style="margin-top:4px">FirstCut looks at every shot and writes down what's in it, so it can find the right B-roll for what's being said.</div></div>
        ${[["account", `Your ${acct} account`, `Fast and cheap: a few seconds a shot. About 150 shots use 1% of a Claude plan's 5-hour window, so a 2,800-shot library is about a fifth of one window. A small contact sheet of each shot is sent to ${acct}.`, true],
           ["local", "This Mac only", "Free and completely private: nothing leaves this Mac. Much slower, about a minute a shot, so a big library takes several nights.", false]].map(([id, name, desc, rec]) =>
          `<label class="card opt" style="border:1px solid ${w === id ? "var(--accent)" : "var(--line)"};border-radius:12px;background:${w === id ? "var(--sel)" : "var(--panel)"};cursor:pointer">
            <input type="radio" name="slook" value="${id}" ${w === id ? "checked" : ""} aria-label="${name}"><div class="grow" style="display:flex;flex-direction:column;gap:4px">
            <div class="row"><b style="font-size:14px">${name}</b>${rec ? `<span class="small" style="font-weight:600;color:var(--link);border:1px solid var(--accent);border-radius:4px;padding:0 6px">Recommended</span>` : ""}</div><div class="muted">${desc}</div></div></label>`).join("")}`; })()}
      <div class="row" style="margin-top:auto;justify-content:space-between"><span class="small muted">You can change all of this any time in Settings.</span>
        <span class="row">${A.setup.running ? "" : `<button class="btn" id="su-start">${steps.some(s => s.state === "failed") ? "Try the failed parts again" : "Download now"}</button>`}<button class="btn primary" id="su-done">${S.setup.done ? "Close" : "Start using FirstCut"}</button></span></div>
    </section>`;
  if (html === SETUP_HTML) return;
  SETUP_HTML = html;
  $("#setup").innerHTML = html;
  document.querySelectorAll("input[name=sai]").forEach(r => r.onchange = () => saveSettings({ai: {use: r.value}}).then(paintSetup));
  document.querySelectorAll("input[name=slook]").forEach(r => r.onchange = () => saveSettings({ai: {look: r.value}, library: {describe_with: r.value}}).then(paintSetup));
  document.querySelectorAll("#setup [data-ai-act]").forEach(b => b.onclick = async () => { b.disabled = true; try { await post("/api/app/ai/" + b.dataset.aiAct); } catch (e) { alert(e.message); } refresh(); });
  $("#su-models").onclick = async () => { const p = await pick("folder", "Choose where to install the AI models", S.places.models); if (p) { await post("/api/app/places", {key: "models", path: p}).catch(e => alert(e.message)); refresh(); } };
  if ($("#su-start")) $("#su-start").onclick = async () => { await post("/api/app/setup/start"); refresh(); };
  $("#su-done").onclick = async () => { if (!A.setup.running && steps.some(s => s.state === "waiting")) await post("/api/app/setup/start"); SETUP_FORCED = false; await saveSettings({setup: {done: true}}); refresh(); };
}

applyAppearance();
refresh().then(() => { if (A && !A.settings.setup.done && !A.setup.running) post("/api/app/setup/start").catch(() => {}); route(false); loadEditors(); loadStyles(); });
</script>
</body>
</html>
